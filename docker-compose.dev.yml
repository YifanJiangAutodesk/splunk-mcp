version: '3.8'

services:
  splunk:
    image: splunk/splunk:latest
    container_name: splunk-dev
    environment:
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_PASSWORD=changeme123
      - SPLUNK_HEC_TOKEN=12345678-1234-1234-1234-123456789012
    ports:
      - "18000:8000"  # Splunk Web
      - "18089:8089"  # Splunk Management
      - "19997:9997"  # Splunk Indexing
      - "18088:8088"  # HTTP Event Collector
    volumes:
      - splunk-data:/opt/splunk/var
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost:8089/services/server/info", "-k", "-u", "admin:changeme123"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mcp:
    build: .
    depends_on:
      splunk:
        condition: service_healthy
    ports:
      - "18001:8001"
    environment:
      - SPLUNK_HOST=splunk
      - SPLUNK_PORT=8089
      - SPLUNK_USERNAME=admin
      - SPLUNK_PASSWORD=changeme123
      - SPLUNK_SCHEME=https
      - VERIFY_SSL=false
      - FASTMCP_PORT=8001
      - FASTMCP_LOG_LEVEL=INFO
      - DEBUG=false
      - MODE=sse
    volumes:
      - ./config:/app/config

volumes:
  splunk-data:
